name: Build

on:
  push:
    branches: [ gmod-ex ]
  pull_request:
    branches: [ gmod-ex ]

jobs:
  build-windows:
    runs-on: windows-2022

    strategy:
      matrix:
        include:
          - build-flavour: release
            output-subdir: _Comp64Release

    steps:
    - name: Setup variables
      uses: actions/github-script@v9
      with:
        script: core.exportVariable('GITHUB_SHA_SHORT', context.sha.substring(0, 7))

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup Meson
      run: pip install meson==1.1.0

    - name: Build
      shell: pwsh
      run: |
        Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process
        . .\build_common.ps1
        PerformBuild -BuildFlavour ${{matrix.build-flavour}} -BuildSubDir ${{matrix.output-subdir}} -Backend ninja -EnableTracy false copy_output

    - name: Copy readme
      run: copy artifacts_readme.txt _output

    - name: Upload x64 binaries
      uses: actions/upload-artifact@v7
      with:
        name: rtx-remix-for-x64-games-${{github.run_number}}-${{env.GITHUB_SHA_SHORT}}-${{matrix.build-flavour}}
        path: |
          _output\*.dll
          _output\*.pdb
          _output\*.txt
          _output\usd\*

    - name: Move DXVK
      shell: pwsh
      run: |
        mkdir _output\.trex
        Move-Item -Path _output\*.dll -Destination _output\.trex\
        Move-Item -Path _output\*.pdb -Destination _output\.trex\
        Move-Item -Path _output\usd -Destination _output\.trex\usd

    - name: Build Bridge
      shell: pwsh
      run: |
        Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process
        pushd bridge
        . .\build_bridge_${{matrix.build-flavour}}.bat
        popd

    - name: Copy Bridge
      shell: pwsh
      run: |
        Copy-Item -Recurse -Path bridge\_output\* -Destination _output\ -Force

    - name: Upload x86 binaries
      uses: actions/upload-artifact@v7
      with:
        name: rtx-remix-for-x86-games-${{github.run_number}}-${{env.GITHUB_SHA_SHORT}}-${{matrix.build-flavour}}
        include-hidden-files: true
        path: |
          _output\*.dll
          _output\*.exe
          _output\*.pdb
          _output\*.txt
          _output\.trex\*.dll
          _output\.trex\*.exe
          _output\.trex\*.pdb
          _output\.trex\usd\*

  notify-slack-on-failure:
    runs-on: ubuntu-latest
    needs: build-windows
    if: ${{ failure() }}

    steps:
    - name: Notify Slack
      uses: slackapi/slack-github-action@v3
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          text: "<!here> Build workflow failed for ${{ github.repository }}"
          blocks:
            - type: section
              text:
                type: mrkdwn
                text: ":rotating-light-red: *Build workflow failed* for `${{ github.repository }}`"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Ref:*\n`${{ github.ref_name }}`"
                - type: mrkdwn
                  text: "*Commit:*\n`${{ github.sha }}`"
                - type: mrkdwn
                  text: "*Event:*\n`${{ github.event_name }}`"
            - type: actions
              elements:
                - type: button
                  text:
                    type: plain_text
                    text: View workflow run
                  url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

    create-nightly-release:
      needs: build-windows
      runs-on: ubuntu-latest
      if: github.event_name == 'push' && github.ref == 'refs/heads/gmod-ex'
      permissions:
        contents: write

      steps:
      - name: Setup variables
        uses: actions/github-script@v7
        with:
          script: core.exportVariable('GITHUB_SHA_SHORT', context.sha.substring(0, 7))

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package nightly release
        run: |
          mkdir -p nightly-release/.trex

          # Copy release build DLLs and USD folder to .trex folder.
          # The launcher looks for .trex or bin folders and copies their contents to bin/win64.
          if [ -d "artifacts/rtx-remix-for-x64-games-${{github.run_number}}-${{env.GITHUB_SHA_SHORT}}-release" ]; then
            cp artifacts/rtx-remix-for-x64-games-${{github.run_number}}-${{env.GITHUB_SHA_SHORT}}-release/*.dll nightly-release/.trex/ || true
            cp artifacts/rtx-remix-for-x64-games-${{github.run_number}}-${{env.GITHUB_SHA_SHORT}}-release/*.txt nightly-release/ || true
            if [ -d "artifacts/rtx-remix-for-x64-games-${{github.run_number}}-${{env.GITHUB_SHA_SHORT}}-release/usd" ]; then
              cp -r artifacts/rtx-remix-for-x64-games-${{github.run_number}}-${{env.GITHUB_SHA_SHORT}}-release/usd nightly-release/.trex/
            fi
          fi

          cd nightly-release
          zip -r ../dxvk-remix-gmod-nightly.zip .
          cd ..

      - name: Delete existing nightly release and tag
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const { owner, repo } = context.repo;

            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: 'nightly'
              });
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.data.id
              });
              console.log('Deleted existing nightly release');
            } catch (error) {
              console.log('No existing nightly release to delete:', error.message);
            }

            await new Promise(resolve => setTimeout(resolve, 1000));

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: 'tags/nightly'
              });
              console.log('Deleted existing nightly tag');
            } catch (error) {
              console.log('No existing nightly tag to delete:', error.message);
            }

            await new Promise(resolve => setTimeout(resolve, 1000));

      - name: Create nightly release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly
          name: "${{env.GITHUB_SHA_SHORT}} - Nightly"
          body: |
            Automated nightly build from commit ${{ github.sha }}

            **Commit:** ${{ github.event.head_commit.message }}
            **Branch:** gmod-ex
            **Build Date:** ${{ github.event.head_commit.timestamp }}

            ⚠️ This is an automated pre-release build and may be unstable.
          prerelease: true
          files: dxvk-remix-gmod-nightly.zip
